<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DayTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>DayTrack</title>
<style>
:root{--bg:#0b1020;--card:#151c2f;--card2:#0f1728;--text:#fff;--muted:#9ca8be;--line:#2b3854;--accent:#6ea8fe;--danger:#47232b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1020,#0d1425);color:var(--text);padding:18px 16px calc(90px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:720px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 20px}
h1{margin:0;font-size:30px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.task{background:rgba(21,28,47,.98);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.task-head{display:flex;justify-content:space-between;gap:12px}.name{font-size:20px;font-weight:800}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#202b44;color:#c6d3ec;height:max-content}
.big{font-size:52px;font-weight:850;line-height:1;margin-top:16px;letter-spacing:-1.5px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.quickstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.q{background:var(--card2);border:1px solid #24314b;border-radius:14px;padding:10px;text-align:center}.q b{display:block;font-size:18px}.q span{font-size:11px;color:var(--muted)}
button{border:0;border-radius:13px;padding:12px 14px;font-weight:750;font-size:15px;margin-top:10px;margin-right:6px}.primary{background:var(--accent);color:#07111f}.secondary{background:#222c45;color:white}.danger{background:var(--danger);color:#ffb7b7}
#addBtn{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:28px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:18px;z-index:10;backdrop-filter:blur(4px)}
.box{width:100%;max-width:540px;max-height:90vh;overflow:auto;background:#151c2f;padding:18px;border:1px solid var(--line);border-radius:22px}
label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
input,select{width:100%;background:#0b1020;color:white;border:1px solid #34405b;border-radius:11px;padding:12px;margin:6px 0 12px;font-size:16px}
.checkrow{display:flex;align-items:center;gap:10px;background:#0b1020;border:1px solid #34405b;border-radius:11px;padding:12px;margin:6px 0 12px}
.checkrow input{width:20px;height:20px;min-height:20px;margin:0}
.checkrow label{margin:0;color:white;flex:1}
.history{border-top:1px solid #2d3850;padding:12px 0;min-height:42px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:#0b1020;padding:12px;border-radius:14px;border:1px solid #24314b}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}
.section-title{margin:22px 0 10px;font-size:15px;color:#d7e0f1}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding:12px 8px 4px;background:#0b1020;border:1px solid #24314b;border-radius:14px}
.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:70%;min-height:3px;background:#6ea8fe;border-radius:7px 7px 3px 3px}.bar-count{font-size:11px;color:#dbe6fb}.bar-label{font-size:10px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:4px}
/* iPhone / installed web-app refinements */
html{
  background:#0b1020;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
body{
  min-height:100dvh;
  padding-top:max(18px,env(safe-area-inset-top));
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button,input,select{font-family:inherit}
button{
  min-height:44px;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
input,select{
  min-height:48px;
  font-size:17px;
}
.task{overflow:hidden}
.actions button{flex:1 1 auto}
#addBtn{
  width:60px;
  height:60px;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
@media (max-width:600px){
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .wrap{max-width:none}
  .header{margin-top:2px;margin-bottom:16px}
  h1{font-size:28px}
  .task{border-radius:20px;padding:16px;margin-bottom:12px}
  .big{font-size:50px}
  .quickstats{gap:7px}
  .q{padding:9px 5px}
  .q b{font-size:17px}
  .q span{font-size:10px}
  .modal{
    align-items:flex-end;
    padding:0;
  }
  .box{
    max-width:none;
    width:100%;
    max-height:calc(92dvh - env(safe-area-inset-top));
    border-radius:24px 24px 0 0;
    border-left:0;
    border-right:0;
    border-bottom:0;
    padding:20px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -20px 60px rgba(0,0,0,.35);
  }
  .box h2{margin-top:2px}
  .chart{gap:4px;padding-left:5px;padding-right:5px}
  .bar-label{font-size:9px}
  .history{font-size:14px}
  .history .danger{min-height:32px}
}
@media (display-mode:standalone){
  .sub::after{content:" • App mode"}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><h1>DayTrack</h1><div class="sub">Private tracker using code names</div></div>
    <button id="syncWidgetBtn" class="secondary" style="margin:0">Sync widget</button>
  </div>
  <div id="list"></div>
</div>
<button id="addBtn" class="primary">+</button>

<div id="editModal" class="modal"><div class="box">
  <h2 id="formTitle">Add tracker</h2>
  <label>Code name</label><input id="name" placeholder="Example: A1, Blue, K2">
  <label>Type</label>
  <select id="type">
    <option value="since">Time since</option>
    <option value="countdown_once">Countdown</option>
    <option value="repeat">Repeat interval</option>
  </select>
  <div id="repeatBox" style="display:none">
    <label>Repeat every how many days?</label>
    <input id="repeat" type="number" value="30" min="1">
  </div>
  <label id="dateLabel">Starting / last completed date</label><input id="date" type="date">
  <label id="timeLabel">Time</label><input id="time" type="time">
  <div class="checkrow">
    <input id="showOnWidget" type="checkbox">
    <label for="showOnWidget">Show this code name on Home Screen widget</label>
  </div>
  <button class="primary" onclick="saveTracker()">Save</button><button class="secondary" onclick="closeEdit()">Cancel</button>
</div></div>

<div id="detailModal" class="modal"><div class="box">
  <h2 id="detailTitle"></h2>
  <div id="stats" class="stats"></div>
  <div class="section-title">Frequency</div>
  <div id="frequency" class="quickstats"></div>
  <div class="section-title">Last 6 months</div>
  <div id="chart" class="chart"></div>
  <div class="actions"><button class="primary" onclick="doneNow()">Done now</button><button class="secondary" onclick="openPastRecord()">Add past record</button></div>
  <div class="section-title">History</div>
  <div id="history"></div>

  <div class="section-title">Year comparison</div>
  <label>Select year</label><select id="yearSelect" onchange="renderYearDetails()"></select>
  <div id="yearSummary" class="stats"></div>
  <div class="section-title">Selected year by month</div>
  <div id="yearChart" class="chart"></div>

  <div class="actions"><button class="secondary" onclick="editCurrent()">Edit tracker</button><button class="danger" onclick="deleteCurrent()">Delete tracker</button><button class="secondary" onclick="closeDetails()">Close</button></div>
</div></div>

<div id="pastModal" class="modal"><div class="box">
  <h2>Add past record</h2>
  <label>Date</label><input id="pastDate" type="date">
  <label>Time</label><input id="pastTime" type="time">
  <button class="primary" onclick="savePastRecord()">Save record</button><button class="secondary" onclick="closePastRecord()">Cancel</button>
</div></div>

<script>
const KEY="daytrack_private_v2";
let data=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[]}');
let editingId=null,currentId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function pad(n){return String(n).padStart(2,"0")}
function nowParts(){const d=new Date();return{date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),time:pad(d.getHours())+":"+pad(d.getMinutes())}}
function makeTimestamp(date,time){return new Date(date+"T"+(time||"12:00")+":00").getTime()}
function formatDateTime(date,time){return new Date(date+"T"+(time||"12:00")+":00").toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function getLast(task){if(task.history&&task.history.length)return[...task.history].sort((a,b)=>makeTimestamp(b.date,b.time)-makeTimestamp(a.date,a.time))[0];return{date:task.startDate,time:task.startTime||"12:00"}}
function getAllEvents(task){let e=(task.history||[]).map(x=>({date:x.date,time:x.time||"12:00"}));if(task.startDate)e.push({date:task.startDate,time:task.startTime||"12:00"});return e.sort((a,b)=>makeTimestamp(a.date,a.time)-makeTimestamp(b.date,b.time))}
function gapHours(a,b){return Math.max(0,(makeTimestamp(b.date,b.time)-makeTimestamp(a.date,a.time))/3600000)}
function prettyGap(hours){if(hours==null||isNaN(hours))return"—";const d=Math.floor(hours/24),h=Math.floor(hours%24);return d>0?(d+"d"+(h?" "+h+"h":"")):(h+"h")}
function calculateIntervals(task){const e=getAllEvents(task),r=[];for(let i=1;i<e.length;i++)r.push(gapHours(e[i-1],e[i]));return r}
function elapsedSince(last){return Math.max(0,(Date.now()-makeTimestamp(last.date,last.time))/3600000)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function recordDates(task){
 const events=(task.history||[]).map(x=>new Date(x.date+"T"+(x.time||"12:00")+":00"));
 if(task.type!=="countdown_once" && task.startDate){
  events.push(new Date(task.startDate+"T"+(task.startTime||"12:00")+":00"));
 }
 const seen=new Set();
 return events.filter(d=>{
  const key=d.getTime();
  if(seen.has(key)) return false;
  seen.add(key);
  return true;
 });
}
function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x}
function countSince(task,from){return recordDates(task).filter(d=>d>=from&&d<=new Date()).length}
function counts(task){const now=new Date(),week=startOfWeek(now),month=new Date(now.getFullYear(),now.getMonth(),1),d30=new Date(now.getTime()-30*86400000);return{week:countSince(task,week),month:countSince(task,month),d30:countSince(task,d30)}}
function monthlyCounts(task){
 const now=new Date(),out=[];
 for(let i=5;i>=0;i--){
  const first=new Date(now.getFullYear(),now.getMonth()-i,1),next=new Date(now.getFullYear(),now.getMonth()-i+1,1);
  const count=recordDates(task).filter(d=>d>=first&&d<next).length;
  out.push({label:first.toLocaleDateString(undefined,{month:"short"}),count})
 }
 return out
}
function availableYears(task){
 const current=new Date().getFullYear();
 const years=recordDates(task).map(d=>d.getFullYear());
 if(task.startDate)years.push(new Date(task.startDate+"T12:00:00").getFullYear());
 const earliest=Math.min(current-1,...years.filter(Number.isFinite));
 const out=[];
 for(let y=current;y>=earliest;y--)out.push(y);
 return out
}
function yearMonthCounts(task,year){
 const dates=recordDates(task),out=[];
 for(let m=0;m<12;m++){
  const first=new Date(year,m,1),next=new Date(year,m+1,1);
  out.push({label:first.toLocaleDateString(undefined,{month:"short"}),count:dates.filter(d=>d>=first&&d<next).length})
 }
 return out
}
function yearTotal(task,year){return recordDates(task).filter(d=>d.getFullYear()===year).length}
function renderYearDetails(){
 const task=data.tasks.find(t=>t.id===currentId);if(!task)return;
 const select=document.getElementById("yearSelect");
 const year=Number(select.value)||new Date().getFullYear();
 const prev=year-1;
 const total=yearTotal(task,year);
 const prevTotal=yearTotal(task,prev);
 const diff=total-prevTotal;
 const pct=prevTotal?Math.round((diff/prevTotal)*100):null;

 document.getElementById("yearSummary").innerHTML=
  '<div class="stat"><b>'+total+'</b><span>'+year+' total</span></div>'+
  '<div class="stat"><b>'+prevTotal+'</b><span>'+prev+' total</span></div>'+
  '<div class="stat"><b>'+(diff>0?"+":"")+diff+'</b><span>Change vs '+prev+'</span></div>'+
  '<div class="stat"><b>'+(pct===null?"—":((pct>0?"+":"")+pct+"%"))+'</b><span>Percent change</span></div>';

 const months=yearMonthCounts(task,year);
 const max=Math.max(1,...months.map(x=>x.count));
 document.getElementById("yearChart").innerHTML=
  months.map(x=>'<div class="bar-wrap"><div class="bar-count">'+x.count+'</div><div class="bar" style="height:'+(x.count/max*100)+'%"></div><div class="bar-label">'+x.label+'</div></div>').join("");
}
function render(){
 const list=document.getElementById("list");list.innerHTML="";
 if(!data.tasks.length){list.innerHTML='<div class="muted">No trackers yet. Tap + to add one.</div>';return}
 data.tasks.forEach(task=>{
  const last=getLast(task),c=counts(task);let number="",label="";
  if(task.type==="countdown_once"){
    const due=makeTimestamp(task.startDate,task.startTime);
    const r=(due-Date.now())/3600000;
    if(r>=0){number=Math.floor(r/24);label="DAYS LEFT • "+Math.floor(r%24)+" HOURS"}
    else{const o=Math.abs(r);number=Math.floor(o/24);label="DAYS PASSED • "+Math.floor(o%24)+" HOURS"}
  } else if(task.type==="repeat" || task.type==="countdown"){
    const due=makeTimestamp(last.date,last.time)+Number(task.repeat||30)*86400000;
    const r=(due-Date.now())/3600000;
    if(r>=0){number=Math.floor(r/24);label="DAYS LEFT • "+Math.floor(r%24)+" HOURS"}
    else{const o=Math.abs(r);number=Math.floor(o/24);label="DAYS OVERDUE • "+Math.floor(o%24)+" HOURS"}
  } else {
    const e=elapsedSince(last);number=Math.floor(e/24);label="DAYS SINCE • "+Math.floor(e%24)+" HOURS"
  }
  const ints=calculateIntervals(task),avg=ints.length?ints.reduce((a,b)=>a+b,0)/ints.length:null;
  const div=document.createElement("div");div.className="task";div.innerHTML=
   '<div class="task-head"><div class="name">'+escapeHtml(task.name)+'</div><div class="pill">'+(task.type==="countdown_once"?"COUNTDOWN":((task.type==="repeat"||task.type==="countdown")?"REPEAT":"SINCE"))+'</div></div>'+
   '<div class="big">'+number+'</div><div class="muted">'+label+'</div>'+
   '<div class="small" style="margin-top:8px">Last: '+formatDateTime(last.date,last.time)+'<br>Average gap: '+(avg!=null?prettyGap(avg):"—")+'</div>'+
   '<div class="quickstats"><div class="q"><b>'+c.week+'</b><span>This week</span></div><div class="q"><b>'+c.month+'</b><span>This month</span></div><div class="q"><b>'+c.d30+'</b><span>Last 30 days</span></div></div>'+
   '<button class="primary" onclick="quickDone(\''+task.id+'\')">Done now</button><button class="secondary" onclick="showDetails(\''+task.id+'\')">Details</button>';
  list.appendChild(div)
 })
}
document.getElementById("addBtn").onclick=()=>{editingId=null;const n=nowParts();document.getElementById("formTitle").textContent="Add tracker";document.getElementById("name").value="";document.getElementById("type").value="since";document.getElementById("repeat").value="30";document.getElementById("date").value=n.date;document.getElementById("time").value=n.time;document.getElementById("showOnWidget").checked=false;updateTypeFields();document.getElementById("editModal").style.display="flex"}
function updateTypeFields(){
 const type=document.getElementById("type").value;
 document.getElementById("repeatBox").style.display=type==="repeat"?"block":"none";
 document.getElementById("dateLabel").textContent=type==="countdown_once"?"Target date":"Starting / last completed date";
 document.getElementById("timeLabel").textContent=type==="countdown_once"?"Target time":"Time";
}
document.getElementById("type").onchange=updateTypeFields
function closeEdit(){document.getElementById("editModal").style.display="none"}
function saveTracker(){const name=document.getElementById("name").value.trim();if(!name){alert("Enter a code name");return}const obj={id:editingId||String(Date.now()),name,type:document.getElementById("type").value,repeat:Number(document.getElementById("repeat").value||30),startDate:document.getElementById("date").value,startTime:document.getElementById("time").value,showOnWidget:document.getElementById("showOnWidget").checked,history:[]};if(editingId){const old=data.tasks.find(t=>t.id===editingId);obj.history=old.history||[];Object.assign(old,obj)}else data.tasks.push(obj);save();closeEdit()}
function quickDone(id){addCurrentRecord(data.tasks.find(t=>t.id===id))}
function doneNow(){addCurrentRecord(data.tasks.find(t=>t.id===currentId));showDetails(currentId)}
function addCurrentRecord(task){const n=nowParts();if(!task.history)task.history=[];task.history.push({date:n.date,time:n.time});save()}
function showDetails(id){
 currentId=id;const task=data.tasks.find(t=>t.id===id);document.getElementById("detailTitle").textContent=task.name;
 const ints=calculateIntervals(task),avg=ints.length?ints.reduce((a,b)=>a+b,0)/ints.length:null,shortest=ints.length?Math.min(...ints):null,longest=ints.length?Math.max(...ints):null,last=getLast(task),current=elapsedSince(last),c=counts(task);
 document.getElementById("stats").innerHTML='<div class="stat"><b>'+prettyGap(current)+'</b><span>Current gap</span></div><div class="stat"><b>'+(avg!=null?prettyGap(avg):"—")+'</b><span>Average gap</span></div><div class="stat"><b>'+(shortest!=null?prettyGap(shortest):"—")+'</b><span>Shortest gap</span></div><div class="stat"><b>'+(longest!=null?prettyGap(longest):"—")+'</b><span>Longest gap</span></div>';
 document.getElementById("frequency").innerHTML='<div class="q"><b>'+c.week+'</b><span>This week</span></div><div class="q"><b>'+c.month+'</b><span>This month</span></div><div class="q"><b>'+c.d30+'</b><span>Last 30 days</span></div>';
 const months6=monthlyCounts(task),max6=Math.max(1,...months6.map(x=>x.count));
 document.getElementById("chart").innerHTML=months6.map(x=>'<div class="bar-wrap"><div class="bar-count">'+x.count+'</div><div class="bar" style="height:'+(x.count/max6*100)+'%"></div><div class="bar-label">'+x.label+'</div></div>').join("");
 const ys=availableYears(task),sel=document.getElementById("yearSelect"),currentYear=new Date().getFullYear();
 sel.innerHTML=ys.map(y=>'<option value="'+y+'">'+y+'</option>').join("");
 sel.value=ys.includes(currentYear)?currentYear:ys[0];
 renderYearDetails();
 const history=document.getElementById("history");history.innerHTML="";const rows=[...(task.history||[])].sort((a,b)=>makeTimestamp(b.date,b.time)-makeTimestamp(a.date,a.time));
 if(!rows.length)history.innerHTML='<div class="muted">No records yet.</div>';
 rows.forEach((item,index)=>{const next=rows[index+1],gap=next?" • "+prettyGap(gapHours(next,item)):"",originalIndex=task.history.indexOf(item),div=document.createElement("div");div.className="history";div.innerHTML=formatDateTime(item.date,item.time)+'<span class="small">'+gap+'</span><button class="danger" style="float:right;margin:0;padding:5px 8px" onclick="deleteRecord(\''+task.id+'\','+originalIndex+')">Delete</button>';history.appendChild(div)});
 document.getElementById("detailModal").style.display="flex"
}
function deleteRecord(id,index){const task=data.tasks.find(t=>t.id===id);if(confirm("Delete this record?")){task.history.splice(index,1);save();showDetails(id)}}
function openPastRecord(){const n=nowParts();document.getElementById("pastDate").value=n.date;document.getElementById("pastTime").value=n.time;document.getElementById("pastModal").style.display="flex"}
function closePastRecord(){document.getElementById("pastModal").style.display="none"}
function savePastRecord(){const task=data.tasks.find(t=>t.id===currentId),date=document.getElementById("pastDate").value,time=document.getElementById("pastTime").value;if(!date||!time){alert("Choose both date and time");return}if(!task.history)task.history=[];task.history.push({date,time});save();closePastRecord();showDetails(currentId)}
function closeDetails(){document.getElementById("detailModal").style.display="none"}
function editCurrent(){const task=data.tasks.find(t=>t.id===currentId);editingId=task.id;document.getElementById("name").value=task.name;document.getElementById("type").value=(task.type==="countdown"?"repeat":task.type);document.getElementById("repeat").value=task.repeat||30;document.getElementById("date").value=task.startDate;document.getElementById("time").value=task.startTime||"12:00";document.getElementById("showOnWidget").checked=!!task.showOnWidget;updateTypeFields();closeDetails();document.getElementById("editModal").style.display="flex"}
function deleteCurrent(){const task=data.tasks.find(t=>t.id===currentId);if(confirm("Delete "+task.name+" and all its history?")){data.tasks=data.tasks.filter(t=>t.id!==currentId);save();closeDetails()}}

async function syncWidget(){
 const selected=data.tasks.filter(t=>t.showOnWidget);
 if(!selected.length){
  alert("Edit at least one tracker and turn on ‘Show this code name on Home Screen widget’.");
  return;
 }
 const payload={
  version:1,
  updatedAt:new Date().toISOString(),
  tasks:selected.map(t=>{
    const last=getLast(t);
    return {
      name:t.name,
      type:t.type,
      startDate:t.startDate,
      startTime:t.startTime||"12:00",
      lastDate:last.date,
      lastTime:last.time||"12:00",
      repeat:Number(t.repeat||30)
    };
  })
 };
 try{
  await navigator.clipboard.writeText("DAYTRACK_WIDGET:"+JSON.stringify(payload));
  window.location.href="scriptable:///run/DayTrackWidget";
 }catch(e){
